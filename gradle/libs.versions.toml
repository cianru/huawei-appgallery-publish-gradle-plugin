###############################################################
# Version Catalog for sharing dependencies:
# https://docs.gradle.org/current/userguide/platforms.html
###############################################################

[versions]
compileSdkVersion = "36"
targetSdkVersion  = "36"
minSdkVersion     = "21"

jvm = "17"
kotlin = "2.1.21"
detekt = "1.23.7"
junitJupiter = "5.10.3"
androidGradlePlugin = "9.0.0"
sampleHuaweiPlugin = "1.6.0"

[libraries]
appcompat = "androidx.appcompat:appcompat:1.7.0"
kotlinBom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }
gson = "com.google.code.gson:gson:2.11.0"
okHttp = "com.squareup.okhttp3:okhttp:4.12.0"
mockServer = "com.squareup.okhttp3:mockwebserver:4.12.0"
androidGradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
detektFormating = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
detektLibraries = { group = "io.gitlab.arturbosch.detekt", name = "detekt-rules-libraries", version.ref = "detekt" }

test-assertk = "com.willowtreeapps.assertk:assertk-jvm:0.28.1"
test-hamcreast = "org.hamcrest:hamcrest:2.2"
test-mockk = "io.mockk:mockk:1.13.12"
test-mockitoCore = "org.mockito:mockito-core:5.12.0"
test-mockitoKotlin = "org.mockito.kotlin:mockito-kotlin:5.4.0"
test-junitJupiterApi = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
test-junitJupiterEngine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
test-junitJupiterParams = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junitJupiter" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version = "1.9.20" }
dcendents = { id = "com.github.dcendents", version = "plugin:2.1" }
bintray = { id = "com.jfrog.bintray", version = "1.8.5" }
pluginPublish = { id = "com.gradle.plugin-publish", version = "1.3.0" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
benManesVersions = { id = "com.github.ben-manes.versions", version = "0.51.0" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
